border:
  thickness: 0.06
  corner-size: 0.16
  corner-height: 1.0
  y-offset: 0.01
  glow: true

list:
  1:
    level: 1
    name: "<#C9B99A>Железный бур"
    block: IRON_BLOCK
    radius: 1 # 1 = зона 3x3 вокруг бура, 0-32
    depth: 16 # сколько слоёв вниз копает, 1-512
    interval-ticks: 40 # пауза между циклами, 20 тиков = 1 секунда
    blocks-per-cycle: 1
    storage-limit: 0 # 0 без лимита
    max-fuel-minutes: 120
    fuel-multiplier: 1.0 # 0.5 вдвое экономнее, 2.0 вдвое прожорливее
    fortune: 0
    silk-touch: false # отключает fortune
    auto-smelt: false # переплавка по smelt из blocks.yml
    remove-liquids: true # убирать воду, лаву, огонь и рыхлый снег в зоне
    border:
      material: WHITE_CONCRETE
      glow-color: "#C9B99A"
    item:
      glow: false
      model-data: 0
      name: "{name} <gray>[<#7FC4B8>{level} LvL<gray>]"
      lore:
        - ""
        - " <#C9B99A>Бур <white>сам копает блоки в своей зоне"
        - " <white>и кладёт добычу на склад."
        - ""
        - " <#C9B99A><u>▌</u> <white>Зона добычи: <#C9B99A>{size}x{size}"
        - " <#C9B99A><u>▌</u> <white>Глубина: <#C9B99A>{depth} слоёв"
        - " <#C9B99A><u>▌</u> <white>Скорость: <#C9B99A>{speed} блоков/мин"
        - " <#C9B99A>▌ <white>Купленное время: <#C9B99A>{fuel}"
        - ""
        - " <#E6C15A>Особенности:"
        - " <gray>▪ <white>Зона 3x3 и глубина 16 слоёв"
        - " <gray>▪ <white>Убирает воду и лаву"
        - ""
        - " <white>Поставь блок и нажми пкм."
        - ""
