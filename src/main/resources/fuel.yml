# Предмет: сколько секунд работы даёт одна штука
items:
  COAL: 60
  CHARCOAL: 60
  COAL_BLOCK: 540
  DRIED_KELP_BLOCK: 150
  BLAZE_ROD: 120

# provider: VAULT, BVAULT, COINSENGINE, PLAYERPOINTS
# currency: для COINSENGINE - ID валюты, для BVAULT - название счёта (обычный счёт называется vault).
# Для VAULT и PLAYERPOINTS currency не используется
money:
  enabled: true
  provider: VAULT
  currency: money
  price-per-minute: 50 # сколько минут покупает кнопка, задано в menus/fuel.yml

config-version: 1 #не трогать!!!
