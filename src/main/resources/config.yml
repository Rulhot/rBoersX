settings:
  metrics: true
  update-check: true

command:
  main: rboersx
  aliases: [ boer, bur ]

limits:
  per-player: 3 # право rboersx.limit.bypass снимает лимит
  allow-overlap: false # пересекаются ли зоны разных буров
  # OWNER: ломает только владелец, ANYONE: любой игрок
  pickup: OWNER

worlds:
  # BLACKLIST: в мирах из list ставить нельзя, WHITELIST: только в них
  mode: BLACKLIST
  list: []

performance:
  autosave-seconds: 60 # минимум 10
  max-scan-per-cycle: 64 # сколько пустых позиций бур пролистывает за цикл, 1-1024
  menu-refresh-ticks: 20 # 20 тиков = 1 секунда, минимум 5
  border-view-radius: 48 # в блоках, 8-128
  border-update-ticks: 20 # минимум 5
  hologram-update-ticks: 20 # минимум 10

sounds:
  click:
    key: "minecraft:ui.button.click"
    volume: 0.5
    pitch: 1.0
  # звук ломания блока буром, volume: 0 выключает
  break:
    volume: 0.6
    pitch: 1.0

config-version: 2 #не трогать!!!
